name: Build Windows launcher

on:
  push:
    tags: ["v*"]        # a v* tag also publishes a GitHub release with the .exe
  workflow_dispatch:     # manual run: exe is available as a workflow artifact

permissions:
  contents: write        # needed to attach the .exe to a release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-build.txt
      - run: python build/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ResumeWriterLauncher-windows
          path: dist/ResumeWriterLauncher.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ResumeWriterLauncher.exe
