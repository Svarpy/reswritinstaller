name: Build Windows launcher

on:
  push:
    branches: [main]    # every push/merge to main builds the exe (workflow artifact)
    tags: ["v*"]        # a v* tag also publishes a GitHub release with the .exe
  workflow_dispatch:     # manual run from the Actions tab

permissions:
  contents: write        # needed to attach the .exe to a release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tagged commit to be on main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "Tag $GITHUB_REF_NAME is not on main; refusing to release."; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-build.txt
      - run: python build/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ResumeWriterLauncher-windows
          path: dist/ResumeWriterLauncher.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ResumeWriterLauncher.exe
