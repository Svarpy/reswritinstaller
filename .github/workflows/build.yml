name: Build Windows launcher

# One run per push/merge to main. If the head commit message contains a version like
# "v1.0" (e.g. merge commit "Release v1.0"), that same run also publishes a GitHub release.
# Outputs: a zipped one-folder build, and an unsigned .msix for the Microsoft Store
# (the Store signs it after certification).
on:
  push:
    branches: [main]
  workflow_dispatch:     # manual run from the Actions tab (artifacts only, no release)

permissions:
  contents: write        # needed to create the release/tag

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out versions
        id: ver
        shell: bash
        run: |
          ver=""
          if [ "${{ github.event_name }}" = "push" ]; then
            msg="$(git log -1 --format=%B)"
            ver="$(printf '%s' "$msg" | grep -oE '\bv[0-9]+\.[0-9]+(\.[0-9]+)?\b' | head -n1 || true)"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [ -n "$ver" ]; then
            IFS=. read -r a b c <<< "${ver#v}"
            msix="$a.$b.${c:-0}.0"       # Store reserves the 4th part: must be 0
          else
            msix="0.0.1.0"               # non-release test build
          fi
          echo "msix_version=$msix" >> "$GITHUB_OUTPUT"
          echo "Release version: '${ver:-none}'  MSIX version: $msix"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-build.txt
      - run: python build/build.py
      - name: Build MSIX (unsigned; the Store signs it)
        shell: bash
        env:
          # Set these under Settings > Secrets and variables > Actions > Variables,
          # using the values from Partner Center > Product identity.
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: python packaging/msix/build_msix.py --version "${{ steps.ver.outputs.msix_version }}"
      - name: Zip one-folder build
        shell: pwsh
        run: Compress-Archive -Path dist/ResumeWriterLauncher -DestinationPath dist/ResumeWriterLauncher-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ResumeWriterLauncher-windows
          path: |
            dist/ResumeWriterLauncher-windows.zip
            dist/ResumeWriterLauncher.msix
      - name: Publish release
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ResumeWriter Launcher ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/ResumeWriterLauncher-windows.zip
            dist/ResumeWriterLauncher.msix
